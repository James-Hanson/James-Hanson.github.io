<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Small, Large Cardinals and Neostability Theory — New Forking Festival</title>
  <link rel="stylesheet" href="deck.css">
</head>
<body>
  <main id="viewer" aria-live="polite">
    <div id="stage" aria-label="Presentation slide">
      <div id="content"></div>
      <div id="k-splitting-overflow-glow" aria-hidden="true"></div>
      <div id="step-overlay" aria-hidden="true"></div>
      <div id="legacy-footer-mask" aria-hidden="true"></div>
      <div id="footer-layer" aria-hidden="true">
        <img id="footer-overlay" alt="">
      </div>
      <div id="loading" role="status">Loading…</div>
    </div>
  </main>

  <div id="counter" aria-hidden="true"></div>
  <div id="help" role="dialog" aria-modal="false" aria-label="Presentation controls">
    <p><kbd>←</kbd>/<kbd>→</kbd> or <kbd>Shift</kbd>+<kbd>Space</kbd>/<kbd>Space</kbd>: navigate</p>
    <p><kbd>Home</kbd>/<kbd>End</kbd>: first/last slide · <kbd>F</kbd>: fullscreen</p>
    <p><kbd>C</kbd>: counter · <kbd>R</kbd>: restart media · <kbd>?</kbd>: this help</p>
  </div>

  <script src="generated/manifest.js"></script>
  <script src="deck.js"></script>
</body>
</html>
