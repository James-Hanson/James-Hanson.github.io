<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The zoo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    .slide {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .track {
      height: min(78vh, 46vw);
      min-width: 410vw;
      display: flex;
      align-items: center;
      transform: translateX(40vw);
      will-change: transform;
    }
    .track img {
      display: block;
      height: 100%;
      width: auto;
      max-width: none;
      object-fit: contain;
    }
    .title-overlay {
      position: absolute;
      z-index: 4;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      object-fit: contain;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="slide">
    <div class="track">
      <img
        src="../generated/assets/higher-arity-stability-diagram.svg"
        alt="Higher-arity neostability diagram"
      >
    </div>
    <img
      class="title-overlay"
      src="../assets/title-overlays/the-zoo.svg"
      alt="The zoo"
    >
  </main>

  <script src="scene-controller.js?v=2"></script>
  <script>
    (() => {
      const track = document.querySelector(".track");
      const start = 40;
      const end = -340;

      const controller = createDeckScrubber({
        baseDuration: 300,
        rewindOnLeft: true,
        render(progress) {
          const position = start + (end - start) * progress;
          track.style.transform = `translateX(${position.toFixed(3)}vw)`;
        },
      });
      if (window !== top) {
        requestAnimationFrame(() => controller.start());
      }
    })();
  </script>
</body>
</html>
