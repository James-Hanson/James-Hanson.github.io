<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinitely many pigeons</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    .slide {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(to bottom, #1b477f 60%, #15335f 60%);
    }
    .ground-grid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      -webkit-mask-image:
        linear-gradient(to bottom, transparent 62%, #000 65%),
        radial-gradient(34vw 12vh at -9.5vw 60vh, transparent 30%, #000 80%),
        radial-gradient(34vw 12vh at 92vw 60vh, transparent 30%, #000 80%);
      -webkit-mask-composite: source-in, source-in;
      mask-image:
        linear-gradient(to bottom, transparent 62%, #000 65%),
        radial-gradient(34vw 12vh at -9.5vw 60vh, transparent 30%, #000 80%),
        radial-gradient(34vw 12vh at 92vw 60vh, transparent 30%, #000 80%);
      mask-composite: intersect;
    }
    .sun {
      position: absolute;
      left: 71%;
      top: 28%;
      width: min(27vw, 27vh);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #ed00c8;
    }
    .grid-fade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(30vw 8vh at -9.5vw 61.5vh, rgba(0, 214, 239, 0.5), rgba(0, 214, 239, 0) 75%),
        radial-gradient(30vw 8vh at 92vw 61.5vh, rgba(0, 214, 239, 0.5), rgba(0, 214, 239, 0) 75%),
        linear-gradient(
          to bottom,
          rgba(0, 214, 239, 0) 60%,
          rgba(0, 214, 239, 0.65) 60%,
          rgba(0, 214, 239, 0.55) 60.7%,
          rgba(0, 214, 239, 0.55) 61.8%,
          rgba(0, 214, 239, 0.3) 62.8%,
          rgba(0, 214, 239, 0) 64%
        );
      -webkit-mask-image: linear-gradient(to bottom, transparent 60%, #000 60%);
      mask-image: linear-gradient(to bottom, transparent 60%, #000 60%);
    }
    .pigeon {
      position: absolute;
    }
    .pigeon img {
      display: block;
      width: 100%;
      height: 100%;
    }
    .pigeon-haze {
      position: absolute;
      inset: 0;
    }
    .pigeon.lead {
      z-index: 6;
    }
    .title-overlay {
      position: absolute;
      z-index: 4;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      object-fit: contain;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="slide">
    <svg
      class="ground-grid"
      viewBox="0 0 100 100"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <path
        fill="none"
        stroke="#00d6ef"
        stroke-width="0.13"
        stroke-opacity="1"
      ></path>
    </svg>
    <div class="sun" aria-hidden="true"></div>
    <div class="grid-fade" aria-hidden="true"></div>
    <img
      class="title-overlay"
      src="../assets/title-overlays/title-overlay-1.png"
      alt="You can't do this forever"
    >
  </main>

  <script src="scene-controller.js"></script>
  <script>
    (() => {
      const slide = document.querySelector(".slide");
      const gridPath = document.querySelector(".ground-grid path");
      const overlay = document.querySelector(".title-overlay");

      const focalLength = 50;
      const ground = 10;
      const horizon = 60;
      const cameraStart = 50;
      const cameraEnd = 0;
      const angleA = 44 * Math.PI / 180;
      const angleB = 40 * Math.PI / 180;
      const directionA = {
        x: Math.sin(angleA),
        z: Math.cos(angleA),
      };
      const directionB = {
        x: Math.cos(angleB),
        z: -Math.sin(angleB),
      };

      const projectX = (x, z, camera) =>
        50 + focalLength * (x - camera) / z;
      const projectGroundY = z =>
        horizon + focalLength * ground / z;

      const near = 2.5;
      const far = 520;
      const spacing = 5;
      const segments = [];

      function addGridLine(pointX, pointZ, direction) {
        if (Math.abs(direction.z) < 1e-6) return;
        let start = (near - pointZ) / direction.z;
        let end = (far - pointZ) / direction.z;
        if (start > end) [start, end] = [end, start];
        segments.push({
          x0: pointX + start * direction.x,
          z0: pointZ + start * direction.z,
          x1: pointX + end * direction.x,
          z1: pointZ + end * direction.z,
        });
      }

      for (let offset = -40; offset <= 40; offset += 1) {
        addGridLine(
          offset * spacing * directionB.x,
          offset * spacing * directionB.z,
          directionA,
        );
      }
      for (let offset = -10; offset <= 80; offset += 1) {
        addGridLine(
          offset * spacing * directionA.x,
          offset * spacing * directionA.z,
          directionB,
        );
      }

      const imageAspect = 2367 / 2127;
      const eyeX = 0.13;
      const count = 40;
      const pigeonSpacing = 16.8;
      const pigeonHeight = 12.94;
      const firstX = -1.10;
      const firstZ = 2.559;
      const hazeStart = 45;
      const hazeEnd = 260;
      const dissolveStart = 260;
      const dissolveEnd = 460;
      const pigeons = [];
      const wrappers = [];
      const hazes = [];

      for (let index = 0; index < count; index += 1) {
        pigeons.push({
          x: firstX + index * pigeonSpacing * directionA.x,
          z: firstZ + index * pigeonSpacing * directionA.z,
        });
      }

      for (let index = count - 1; index >= 0; index -= 1) {
        const lowResolution = index >= 2;
        const wrapper = document.createElement("div");
        wrapper.className = index === 0 ? "pigeon lead" : "pigeon";

        const pigeon = document.createElement("img");
        pigeon.src = lowResolution
          ? "../assets/pigeon-clipart-cutout-lo.png"
          : "../assets/pigeon-clipart-cutout.png";
        pigeon.alt = "";

        const haze = document.createElement("img");
        haze.className = "pigeon-haze";
        haze.src = lowResolution
          ? "../assets/pigeon-haze-lo.png"
          : "../assets/pigeon-haze.png";
        haze.alt = "";
        haze.style.opacity = "0";

        wrapper.append(pigeon, haze);
        slide.insertBefore(wrapper, overlay);
        wrappers[index] = wrapper;
        hazes[index] = haze;
      }

      let lastCamera = cameraStart;

      function smoothstep(value) {
        return value * value * (3 - 2 * value);
      }

      function renderCamera(camera) {
        lastCamera = camera;
        let path = "";
        for (const segment of segments) {
          path +=
            `M${projectX(segment.x0, segment.z0, camera).toFixed(2)},` +
            `${projectGroundY(segment.z0).toFixed(2)}` +
            `L${projectX(segment.x1, segment.z1, camera).toFixed(2)},` +
            `${projectGroundY(segment.z1).toFixed(2)}`;
        }
        gridPath.setAttribute("d", path);

        const viewportAspect =
          window.innerWidth / window.innerHeight || 4 / 3;

        for (let index = 0; index < count; index += 1) {
          const { x, z } = pigeons[index];
          const height = focalLength * pigeonHeight / z;
          const width = height * imageAspect / viewportAspect;
          const wrapper = wrappers[index];
          wrapper.style.height = `${height}vh`;
          wrapper.style.width = `${width}vw`;
          wrapper.style.left =
            `${projectX(x, z, camera) - eyeX * width}vw`;
          wrapper.style.top = `${projectGroundY(z) - height}vh`;

          const hazeProgress = Math.min(
            1,
            Math.max(0, (z - hazeStart) / (hazeEnd - hazeStart)),
          );
          hazes[index].style.opacity = smoothstep(hazeProgress);

          const dissolveProgress = Math.min(
            1,
            Math.max(
              0,
              (z - dissolveStart) / (dissolveEnd - dissolveStart),
            ),
          );
          wrapper.style.opacity = 1 - smoothstep(dissolveProgress);
        }
      }

      const easeOut = progress => 1 - Math.pow(1 - progress, 3);

      createDeckScrubber({
        baseDuration: 18,
        hangAtEnd: true,
        acceleration: 0.658 * 0.2,
        render(progress) {
          renderCamera(
            cameraStart
              + (cameraEnd - cameraStart) * easeOut(progress),
          );
        },
      });

      addEventListener("resize", () => renderCamera(lastCamera));
    })();
  </script>
</body>
</html>
