<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What can you do? A little of both?</title>
  <style>
    @font-face {
      font-family: "Jokerman";
      src: url("../assets/fonts/Jokerman.otf") format("opentype");
      font-display: block;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    main,
    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .background {
      display: block;
      object-fit: contain;
    }

    .both {
      position: absolute;
      top: 27%;
      left: 50%;
      margin: 0;
      font-family: "Jokerman", fantasy;
      font-size: clamp(4.5rem, 10vw, 9rem);
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      background: linear-gradient(90deg, #ed00c8 0%, #00d6ef 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <main>
    <img
      class="background"
      src="../generated/slides/what-can-you-do/step-05.svg"
      alt=""
    >
    <p class="both">a little of both?</p>
  </main>
</body>
</html>
