<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Definition of stability</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
      color: #000;
    }

    main {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 8%;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: sans-serif;
      font-size: clamp(2.5rem, 5.5vw, 6rem);
      font-weight: 600;
      line-height: 1.12;
    }
  </style>
</head>
<body>
  <main aria-label="Dummy slide">
    <h1>definition of stability</h1>
  </main>
</body>
</html>
