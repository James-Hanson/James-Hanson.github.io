<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application scribble — 20 variants</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  main { max-width: 1600px; margin: auto; padding: 20px 28px; }
  h1 { margin: 0 0 6px; font-size: 25px; font-weight: 400; }
  p { margin: 0 0 18px; color: #aaa; font-size: 15px; }
  #variants { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  button { position: relative; padding: 25px 8px 8px; border: 1px solid #333; border-radius: 6px; background: #000; color: white; cursor: pointer; }
  button:hover { border-color: #0abdc6; }
  button[aria-pressed="true"] { border: 2px solid #0abdc6; padding: 24px 7px 7px; }
  .number { position: absolute; left: 10px; top: 5px; font-size: 16px; color: #bbb; }
  svg { width: 100%; height: auto; display: block; }
  #choice { min-height: 24px; margin-top: 16px; color: #0abdc6; }
  @media (max-width: 800px) { #variants { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>Application scribble — choose a variant</h1>
  <p>Click a number to highlight it, then tell me which one you want.</p>
  <div id="variants"></div>
  <p id="choice" aria-live="polite"></p>
</main>
<script>
const variants = [
  [[231,133],[247,103],[270,137],[283,108],[308,132],[325,101]],
  [[230,133],[249,106],[266,135],[286,102],[306,137],[326,106]],
  [[230,137],[245,107],[270,131],[285,104],[307,136],[326,102]],
  [[231,132],[251,101],[267,138],[282,106],[307,134],[325,104]],
  [[230,135],[243,104],[267,133],[290,108],[307,138],[326,102]],
  [[229,134],[250,108],[264,137],[284,102],[310,131],[327,105]],
  [[231,138],[246,103],[273,132],[287,107],[305,136],[325,102]],
  [[232,131],[252,105],[268,137],[281,101],[309,134],[324,108]],
  [[229,136],[244,108],[264,132],[288,103],[312,138],[327,106]],
  [[232,134],[246,102],[269,138],[290,107],[307,131],[324,103]],
  [[230,137],[251,104],[273,133],[285,108],[304,136],[326,101]],
  [[231,132],[244,106],[268,138],[292,102],[309,135],[325,108]],
  [[229,135],[248,101],[263,132],[283,108],[313,137],[327,104]],
  [[232,138],[253,108],[269,134],[282,103],[305,131],[324,105]],
  [[230,131],[246,104],[275,137],[289,101],[308,133],[326,107]],
  [[231,136],[250,107],[265,131],[280,102],[309,138],[325,104]],
  [[229,133],[243,102],[269,137],[291,106],[313,132],[327,108]],
  [[232,135],[254,103],[272,138],[286,108],[304,134],[324,101]],
  [[230,138],[245,105],[263,134],[286,101],[311,131],[326,107]],
  [[231,134],[248,108],[274,132],[291,104],[308,137],[325,102]]
];
const ns = 'http://www.w3.org/2000/svg';
variants.forEach((points, i) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.setAttribute('aria-label', `Variant ${i + 1}`);
  button.setAttribute('aria-pressed', 'false');
  const number = document.createElement('span');
  number.className = 'number';
  number.textContent = i + 1;
  button.append(number);
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '218 96 122 49');
  const image = document.createElementNS(ns, 'image');
  image.setAttribute('href', '../small-large-Forking-Festival-2026/generated/slides/application/step-01.svg?v=f636dc973c6a');
  image.setAttribute('width', '362.835');
  image.setAttribute('height', '272.126');
  svg.append(image);
  const path = document.createElementNS(ns, 'path');
  path.setAttribute('d', points.map(([x,y], j) => `${j ? 'L' : 'M'} ${x} ${y}`).join(' '));
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#0abdc6');
  path.setAttribute('stroke-width', '1');
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');
  svg.append(path);
  button.append(svg);
  button.addEventListener('click', () => {
    document.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false'));
    button.setAttribute('aria-pressed', 'true');
    document.getElementById('choice').textContent = `Selected variant ${i + 1}`;
  });
  document.getElementById('variants').append(button);
});
</script>
</body>
</html>
